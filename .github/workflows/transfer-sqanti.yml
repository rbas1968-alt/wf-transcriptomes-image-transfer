name: Transfer ONT SQANTI image

on:
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      SOURCE_IMAGE: docker.io/ontresearch/wf-transcriptomes-sqanti@sha256:d100245103571f71eac34bc0fe66c35c73424a359eff0acb795e26e7b6832049
      IMAGE_TAG: sha5bd775836492699e2537ebf846098eb117191d87

      ACR_NAMESPACE: wf-transcriptomes
      ACR_REPOSITORY: wf-transcriptomes-sqanti

      EXPECTED_DIGEST: sha256:d100245103571f71eac34bc0fe66c35c73424a359eff0acb795e26e7b6832049
      REGISTRY_AUTH_FILE: /tmp/acr-auth.json

    steps:

      - name: Install skopeo
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y skopeo

          echo "===== SKOPEO ====="
          skopeo --version

          echo "===== DOCKER ====="
          docker --version

      - name: Verify source image
        run: |
          set -euo pipefail

          SRC_DIGEST="$(skopeo inspect \
            --format '{{.Digest}}' \
            "docker://${SOURCE_IMAGE}")"

          echo "Expected source digest: ${EXPECTED_DIGEST}"
          echo "Actual source digest:   ${SRC_DIGEST}"

          test "${SRC_DIGEST}" = "${EXPECTED_DIGEST}"

          echo "SOURCE_IMAGE_PASS"

      - name: Check ACR endpoint
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: |
          set -euo pipefail

          echo "===== ACR REGISTRY ENDPOINT ====="

          curl -sS \
            --connect-timeout 10 \
            --max-time 30 \
            -D /tmp/acr_headers.txt \
            -o /tmp/acr_body.txt \
            "https://${ACR_REGISTRY}/v2/" || true

          cat /tmp/acr_headers.txt

          echo
          echo "===== RESPONSE BODY ====="
          cat /tmp/acr_body.txt || true

      - name: Check GitHub secret format
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os

          for key in (
              "ACR_REGISTRY",
              "ACR_USERNAME",
              "ACR_PASSWORD",
          ):
              value = os.environ.get(key, "")

              print(
                  f"{key}:",
                  f"length={len(value)}",
                  f"empty={not bool(value)}",
                  f"leading_whitespace={bool(value and value[0].isspace())}",
                  f"trailing_whitespace={bool(value and value[-1].isspace())}",
                  f"contains_CR={chr(13) in value}",
                  f"contains_LF={chr(10) in value}",
              )
          PY

          echo "SECRET_FORMAT_CHECK_FINISHED"

      - name: Verify ACR login with Docker
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s' "${ACR_PASSWORD}" | \
          docker login \
            --username "${ACR_USERNAME}" \
            --password-stdin \
            "${ACR_REGISTRY}"

          echo "DOCKER_ACR_LOGIN_PASS"

      - name: Verify ACR login with Skopeo
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail

          rm -f "${REGISTRY_AUTH_FILE}"

          printf '%s' "${ACR_PASSWORD}" | \
          skopeo login \
            --authfile "${REGISTRY_AUTH_FILE}" \
            --username "${ACR_USERNAME}" \
            --password-stdin \
            "${ACR_REGISTRY}"

          test -s "${REGISTRY_AUTH_FILE}"

          echo "SKOPEO_ACR_LOGIN_PASS"

      - name: Transfer exact image to ACR
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: |
          set -euo pipefail

          DEST_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}:${IMAGE_TAG}"

          echo "===== SOURCE ====="
          echo "${SOURCE_IMAGE}"

          echo
          echo "===== DESTINATION ====="
          echo "${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}:${IMAGE_TAG}"

          skopeo copy \
            --authfile "${REGISTRY_AUTH_FILE}" \
            --preserve-digests \
            --retry-times 10 \
            "docker://${SOURCE_IMAGE}" \
            "docker://${DEST_IMAGE}"

          echo "IMAGE_TRANSFER_FINISHED"

      - name: Verify ACR image digest
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: |
          set -euo pipefail

          DEST_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}:${IMAGE_TAG}"

          DEST_DIGEST="$(skopeo inspect \
            --authfile "${REGISTRY_AUTH_FILE}" \
            --format '{{.Digest}}' \
            "docker://${DEST_IMAGE}")"

          echo "Expected digest:    ${EXPECTED_DIGEST}"
          echo "Destination digest: ${DEST_DIGEST}"

          test "${DEST_DIGEST}" = "${EXPECTED_DIGEST}"

          echo "SQANTI_IMAGE_TRANSFER_PASS"

      - name: Clean credentials
        if: always()
        run: |
          rm -f "${REGISTRY_AUTH_FILE}"
          docker logout "${{ secrets.ACR_REGISTRY }}" >/dev/null 2>&1 || true
