name: Test ACR Docker Push

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ACR_NAMESPACE: wf-transcriptomes
     ACR_REPOSITORY: acr-smoke
      TEST_TAG: acr-smoke-test

    steps:
      - name: Login to Alibaba Cloud ACR
        uses: aliyun/acr-login@v1
        with:
          login-server: https://${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Verify Docker login
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: |
          set -euo pipefail

          test -s "$HOME/.docker/config.json"

          echo "ACR_DOCKER_LOGIN_PASS"

      - name: Pull tiny test image
        run: |
          set -euo pipefail

          docker pull hello-world:latest

          docker image inspect hello-world:latest >/dev/null

          echo "TEST_IMAGE_PULL_PASS"

      - name: Push tiny image to ACR
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: |
          set -euo pipefail

          DEST="${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}:${TEST_TAG}"

          echo "Destination:"
          echo "${DEST}"

          docker tag hello-world:latest "${DEST}"

          docker push "${DEST}"

          echo "ACR_DOCKER_PUSH_PASS"

      - name: Verify pushed image
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: |
          set -euo pipefail

          DEST="${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}:${TEST_TAG}"

          docker manifest inspect "${DEST}" >/dev/null

          echo "ACR_SMOKE_TEST_PASS"

      - name: Logout
        if: always()
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
        run: |
          docker logout "${ACR_REGISTRY}" >/dev/null 2>&1 || true
